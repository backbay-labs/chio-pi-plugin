# Source/package checks are not real-host acceptance. Required I01-I08
# evidence must be executed separately with the exact delivered artifacts.
name: ci
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PACKAGE_NAME: '@chio-protocol/pi-plugin'
  TZ: UTC
  LC_ALL: C
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.19.0
    - name: Pin npm
      run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
    - name: Install locked dependencies
      working-directory: .
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Install Linux sandbox prerequisite for launcher contract tests
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
    - name: Typecheck, build, and unit regressions
      working-directory: .
      run: |
        set -euo pipefail
        rm -rf dist
        npm run typecheck
        npm run build
        npm test
    - name: Build staged release artifact
      working-directory: .
      run: |
        set -euo pipefail
        npm run pack:release -- "${RUNNER_TEMP}/chio-release"
    - name: Qualify base and Durable cold consumers
      id: consumers
      working-directory: .
      run: |
        set -euo pipefail
        node scripts/qualify-release.mjs --release "${RUNNER_TEMP}/chio-release" \
          --work "${RUNNER_TEMP}/chio-consumers" --evidence "${RUNNER_TEMP}/chio-consumer-evidence"
    - name: Dry-run publication only
      run: |
        set -euo pipefail
        cd "${RUNNER_TEMP}/chio-release"
        sha256sum --check ./*.sha256
        artifacts=(./*.tgz)
        test "${#artifacts[@]}" -eq 1
        npm publish "$(realpath "${artifacts[0]}")" --dry-run --ignore-scripts --access public
    - name: Retain qualified package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-package
        path: ${{ runner.temp }}/chio-release
        if-no-files-found: error
    - name: Retain cold consumer evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: consumer-evidence
        path: ${{ runner.temp }}/chio-consumer-evidence
        # Missing evidence fails only a run whose qualification succeeded; an
        # earlier failure keeps one failing step and uploads any partial evidence.
        if-no-files-found: ${{ steps.consumers.outcome == 'success' && 'error' || 'warn' }}
