name: release

# Manual runs qualify artifacts only. Tag pushes may publish subject to the
# configured environment protections; package checks do not establish host I01-I08 acceptance.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LC_ALL: C
  PACKAGE_DIRECTORY: .
  PACKAGE_NAME: "@chio-protocol/pi-plugin"
  TAG_PREFIX: v

jobs:
  build:
    permissions:
      contents: read
      actions: read
    name: Qualify staged package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Pin npm
        run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - name: Bind package, tag, and source identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "${GITHUB_ENV}"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync(`${process.env.PACKAGE_DIRECTORY}/package.json`));
          if (pkg.name !== process.env.PACKAGE_NAME) throw new Error('wrong package');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(pkg.version)) throw new Error('invalid version');
          const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          if (pkg.repository?.url !== expected) throw new Error(`repository.url must equal ${expected}`);
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_NAME !== `${process.env.TAG_PREFIX}${pkg.version}`) throw new Error('tag/package version mismatch');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
            git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          fi
          # The SLSA verifier requires a release-tag reference. Fail if the
          # verified upstream tag moves; ordinary actions use commit SHAs.
          test "$(gh api repos/slsa-framework/slsa-github-generator/git/ref/tags/v2.1.0 --jq '.object.sha')" = f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
      - name: Enforce publication prerequisites
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          async function read(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(30000), redirect: 'error',
            });
            if (!response.ok) throw new Error(`release prerequisite unavailable: ${path} HTTP ${response.status}`);
            return response.json();
          }
          const environment = await read('environments/npm');
          if (environment.name !== 'npm') {
            throw new Error('npm environment must be explicitly configured before a release tag');
          }
          // GitHub enforces this environment's configured protections. Do not
          // invent a reviewer requirement or mutate repository settings.
          const ci = await read(`actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&branch=main&per_page=1`);
          const run = ci.workflow_runs?.[0];
          if (!run || run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error('latest main CI push run for this exact source must complete successfully before publication');
          }
          console.log(`Verified configured npm environment and exact-source CI run ${run.id}`);
          NODE
      - name: Install locked dependencies
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Linux sandbox prerequisite for launcher contract tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Typecheck, build, and unit regressions
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: |
          set -euo pipefail
          rm -rf dist
          npm run typecheck
          npm run build
          npm test
      - name: Build staged release artifact
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run pack:release -- "${RUNNER_TEMP}/chio-release"

      - name: Qualify base and Durable cold consumers
        id: consumers
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/qualify-release.mjs --release "${RUNNER_TEMP}/chio-release" \
            --work "${RUNNER_TEMP}/chio-consumers" --evidence "${RUNNER_TEMP}/chio-consumer-evidence"
      - name: Dry-run publication
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/chio-release"
          sha256sum --check ./*.sha256
          artifacts=(./*.tgz)
          test "${#artifacts[@]}" -eq 1
          # The packed manifest must carry the bound registry name and version.
          ARCHIVE_MANIFEST="$(tar -xzOf "${artifacts[0]}" package/package.json)" node --input-type=module <<'NODE'
          const pkg = JSON.parse(process.env.ARCHIVE_MANIFEST);
          if (pkg.name !== process.env.PACKAGE_NAME || pkg.version !== process.env.PACKAGE_VERSION) throw new Error(`archive identity ${pkg.name}@${pkg.version} is not ${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION}`);
          NODE
          npm publish "$(realpath "${artifacts[0]}")" --dry-run --ignore-scripts --access public
      - name: Record source and artifact identities
        id: subjects
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cd "${RUNNER_TEMP}/chio-release"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('release-identity.json', `${JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY, source: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF, package: process.env.PACKAGE_NAME,
            version: process.env.PACKAGE_VERSION, node: process.version,
            workflowRun: process.env.GITHUB_RUN_ID, workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
            qualification: 'source, unit, and clean package checks; host acceptance is separate'
          }, null, 2)}\n`);
          NODE
          sha256sum -- *.tgz  release-identity.json > SHA256SUMS
          echo "subjects=$(base64 -w0 < SHA256SUMS)" >> "${GITHUB_OUTPUT}"
      - name: Retain qualified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-package
          path: ${{ runner.temp }}/chio-release
          if-no-files-found: error
          retention-days: 90
      - name: Retain cold consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-evidence
          path: ${{ runner.temp }}/chio-consumer-evidence
          # Missing evidence fails only a run whose qualification succeeded; an
          # earlier failure keeps one failing step and uploads any partial evidence.
          if-no-files-found: ${{ steps.consumers.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 90

  provenance:
    name: Generate isolated SLSA provenance
    needs: build
    permissions:
      id-token: write
      # Required by the reusable workflow declaration; upload-assets is false.
      contents: write
      actions: read
    # Upstream requires a version tag for slsa-verifier. The build job checks
    # v2.1.0 resolves to f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.subjects }}
      provenance-name: package.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish qualified package
    needs: [build, provenance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
      - name: Enforce publication prerequisites
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          async function read(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(30000), redirect: 'error',
            });
            if (!response.ok) throw new Error(`release prerequisite unavailable: ${path} HTTP ${response.status}`);
            return response.json();
          }
          const environment = await read('environments/npm');
          if (environment.name !== 'npm') {
            throw new Error('npm environment must be explicitly configured before a release tag');
          }
          // GitHub enforces this environment's configured protections. Do not
          // invent a reviewer requirement or mutate repository settings.
          const ci = await read(`actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&branch=main&per_page=1`);
          const run = ci.workflow_runs?.[0];
          if (!run || run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error('latest main CI push run for this exact source must complete successfully before publication');
          }
          console.log(`Verified configured npm environment and exact-source CI run ${run.id}`);
          NODE
      - name: Pin npm
        run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - name: Require npm trusted publishing support
        run: |
          set -euo pipefail
          # npm trusted publishing (OIDC) requires npm 11.5.1 and Node 22.14.0 or later.
          # No NODE_AUTH_TOKEN is configured; npm exchanges this job's OIDC identity.
          NPM_VERSION="$(npm --version)" node --input-type=module <<'NODE'
          const atLeast = (version, minimum) => {
            const [a, b] = [version, minimum].map(value => value.split(/[.-]/).slice(0, 3).map(part => Number.parseInt(part, 10)));
            for (let index = 0; index < 3; index++) if (a[index] !== b[index]) return a[index] > b[index];
            return true;
          };
          if (!atLeast(process.env.NPM_VERSION, '11.5.1')) throw new Error(`npm ${process.env.NPM_VERSION} cannot use trusted publishing`);
          if (!atLeast(process.versions.node, '22.14.0')) throw new Error(`Node ${process.versions.node} cannot use trusted publishing`);
          console.log(`npm ${process.env.NPM_VERSION} with Node ${process.versions.node} supports trusted publishing`);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-package
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package.intoto.jsonl
          path: release
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Verify provenance, source, and artifact digests
        working-directory: release
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const id = JSON.parse(readFileSync('release-identity.json'));
          if (id.source !== process.env.GITHUB_SHA || id.repository !== process.env.GITHUB_REPOSITORY || id.ref !== process.env.GITHUB_REF || id.package !== process.env.PACKAGE_NAME || id.version !== process.env.PACKAGE_VERSION) throw new Error('artifact identity mismatch');
          NODE
          artifacts=(./*.tgz)
          test "${#artifacts[@]}" -eq 1
          ARCHIVE_MANIFEST="$(tar -xzOf "${artifacts[0]}" package/package.json)" node --input-type=module <<'NODE'
          const pkg = JSON.parse(process.env.ARCHIVE_MANIFEST);
          if (pkg.name !== process.env.PACKAGE_NAME || pkg.version !== process.env.PACKAGE_VERSION) throw new Error(`archive identity ${pkg.name}@${pkg.version} is not ${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION}`);
          NODE
          slsa-verifier verify-artifact ./*.tgz  release-identity.json \
            --provenance-path package.intoto.jsonl \
            --source-uri "github.com/${GITHUB_REPOSITORY}" --source-tag "${GITHUB_REF_NAME}"
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0 commit
        with:
          cosign-release: v2.4.1
      - name: Sign and verify checksum index
        working-directory: release
        run: |
          set -euo pipefail
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
          cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: Publish exact tarball with npm Trusted Publishing
        working-directory: release
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          dist_tag=latest
          if [[ "${PACKAGE_VERSION}" == *-* ]]; then dist_tag=next; fi
          npm publish ./*.tgz --access public --provenance --ignore-scripts --tag "${dist_tag}"
      - name: Attach qualified artifacts and evidence
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo "${GITHUB_REPOSITORY}" --verify-tag --title "${PACKAGE_NAME} ${GITHUB_REF_NAME}" --notes "Qualified package artifacts. See docs/RELEASE-QUALIFICATION.md for evidence verification and the separate host acceptance boundary.")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" ./*.tgz  SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem release-identity.json package.intoto.jsonl
      - name: Retain publication evidence even after a registry or upload failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-evidence
          path: release
          if-no-files-found: error
          retention-days: 90
